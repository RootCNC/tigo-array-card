  - title: Diagnostics
    path: diagnostics
    icon: mdi:stethoscope
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Health
            heading_style: title
            icon: mdi:alert-circle-outline
          - type: custom:auto-entities
            grid_options: *id001
            card:
              type: entities
              title: Panels with no data
            filter:
              include:
                - entity_id: sensor.tigo_ts4_*_power
                  state: unavailable
            show_empty: false
          - type: tile
            entity: sensor.connection_status
            name: Fox Modbus link
            color: green
            grid_options:
              columns: full
          - type: custom:auto-entities
            grid_options: *id001
            card:
              type: entities
              title: Performance – lowest first
            filter:
              include:
                - entity_id: sensor.tigo_ts4_*_performance
              exclude:
                - state: unavailable
            sort:
              method: state
              numeric: true
              reverse: false
      - type: grid
        cards:
          - type: heading
            heading: Panel temperature
            heading_style: title
            icon: mdi:thermometer
          - type: custom:auto-entities
            grid_options: *id001
            card:
              type: entities
              title: Hottest first
            filter:
              include:
                - entity_id: sensor.tigo_ts4_*_temperature
              exclude:
                - state: unavailable
            sort:
              method: state
              numeric: true
              reverse: true
      - type: grid
        cards:
          - type: heading
            heading: Comms
            heading_style: title
            icon: mdi:access-point
          - type: custom:auto-entities
            grid_options: *id001
            card:
              type: entities
              title: RSSI
            filter:
              include:
                - entity_id: sensor.tigo_ts4_*_rssi
              exclude:
                - state: unavailable
            sort:
              method: state
              numeric: true
              reverse: false
          - type: custom:auto-entities
            grid_options: *id001
            card:
              type: entities
              title: Readings today
            filter:
              include:
                - entity_id: sensor.tigo_ts4_*_readings_today
              exclude:
                - state: unavailable
            sort:
              method: state
              numeric: true
              reverse: false
          - type: entities
            grid_options: *id001
            title: Firmware
            entities:
              - entity: sensor.master_version
                name: Master
              - entity: sensor.slave_version
                name: Slave
              - entity: sensor.manager_version
                name: Manager
